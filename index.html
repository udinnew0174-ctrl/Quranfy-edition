<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quranfy+ | By Udin AI </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #E0F2FE; --primary: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #1e293b; transition: all 0.3s; }
        .font-arabic { font-family: 'Amiri', serif; }
        .neu-flat { background: var(--bg); box-shadow: 5px 5px 10px #beccd7, -5px -5px 10px #ffffff; }
        .neu-pressed { background: var(--bg); box-shadow: inset 3px 3px 6px #beccd7, inset -3px -3px 6px #ffffff; }
        .glass { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .active-card { border-right: 5px solid var(--primary); background: rgba(255,255,255,0.4); }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body class="pb-44">

    <nav class="sticky top-0 z-50 glass px-5 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <button id="btn-back" onclick="showHome()" class="hidden p-2 neu-flat rounded-xl active:scale-90 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h1 class="text-lg font-bold text-blue-700 tracking-tight">Quranfy+</h1>
        </div>
        <div id="tab-switcher" class="hidden flex p-1 rounded-xl neu-pressed text-[10px] font-bold">
            <button onclick="switchMode('ayat')" id="tab-ayat" class="px-4 py-1.5 rounded-lg bg-white shadow-sm text-blue-600">AYAT</button>
            <button onclick="switchMode('tafsir')" id="tab-tafsir" class="px-4 py-1.5 rounded-lg">TAFSIR</button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-5">
        <div id="search-section" class="mb-6">
            <input type="text" oninput="filterSurah(this.value)" placeholder="Cari Surat (Contoh: Yasin)..." class="w-full p-4 rounded-2xl neu-pressed outline-none text-sm focus:ring-2 ring-blue-200 transition-all">
        </div>
        <div id="main-content" class="space-y-4">
            <div class="text-center py-20 opacity-50">Memuat Kalamullah...</div>
        </div>
    </main>

    <div id="player-bar" class="fixed bottom-0 left-0 right-0 glass px-6 py-5 translate-y-full transition-transform duration-500 z-50 rounded-t-[2.5rem] shadow-2xl border-t border-white/50">
        <div class="max-w-2xl mx-auto flex flex-col gap-3">
            
            <div class="flex justify-between items-center">
                <div class="min-w-0 flex-1">
                    <p id="p-surah" class="font-bold text-xs truncate text-blue-800">Nama Surat</p>
                    <p id="p-mode-label" class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Memuat Audio...</p>
                </div>
                <select id="qari-select" onchange="changeQari(this.value)" class="bg-white/60 text-[10px] font-bold text-blue-600 outline-none p-2 rounded-xl shadow-sm">
                    <option value="4">Abdul Basit (Mujawwad)</option>
                    <option value="1">Misyari Rasyid</option>
                    <option value="2">Saad Al-Ghamdi</option>
                    <option value="3">Abdurrahman as-Sudais</option>
                </select>
            </div>

            <div class="flex flex-col gap-1">
                <input type="range" id="p-slider" class="w-full h-1.5 bg-blue-100 rounded-lg appearance-none cursor-pointer" value="0">
                <div class="flex justify-between text-[10px] font-mono font-bold text-slate-400">
                    <span id="p-current">0:00</span>
                    <span id="p-total">0:00</span>
                </div>
            </div>
            
            <div class="flex items-center justify-center gap-10">
                <button onclick="prevAyat()" class="p-3 neu-flat rounded-full active:scale-90 transition-transform">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button id="p-main-btn" onclick="togglePlay()" class="p-5 bg-blue-600 text-white rounded-full shadow-lg shadow-blue-200 active:scale-90 transition-all">
                    <svg id="svg-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="svg-pause" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button onclick="nextAyat()" class="p-3 neu-flat rounded-full active:scale-90 transition-transform">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_EQURAN = "https://equran.id/api/v2";
        const API_UMMAH = "https://ummahapi.com/api/quran/audio";
        
        let store = { 
            all: [], surah: null, tafsir: null, ummahData: null,
            qari: '4', idx: -1, mode: 'ayat', audio: new Audio() 
        };

        window.onload = () => {
            fetchList();
            initAudioCore();
        };

        async function fetchList() {
            try {
                const res = await fetch(`${API_EQURAN}/surat`);
                const json = await res.json();
                store.all = json.data;
                renderHome(store.all);
            } catch (e) { alert("Gagal mengambil data. Cek koneksi Pian."); }
        }

        function renderHome(data) {
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('tab-switcher').classList.add('hidden');
            document.getElementById('search-section').classList.remove('hidden');
            
            const html = data.map(s => `
                <div onclick="loadSurahDetail(${s.nomor})" class="p-5 rounded-2xl neu-flat flex justify-between items-center cursor-pointer active:scale-95 transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 text-blue-600 font-bold text-xs">#${s.nomor}</div>
                        <div>
                            <h3 class="font-bold text-sm">${s.namaLatin}</h3>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">${s.arti} • ${s.jumlahAyat} Ayat</p>
                        </div>
                    </div>
                    <p class="font-arabic text-xl text-blue-600">${s.nama}</p>
                </div>
            `).join('');
            document.getElementById('main-content').innerHTML = html;
        }

        async function loadSurahDetail(no) {
            document.getElementById('main-content').innerHTML = "<div class='text-center py-20 animate-pulse text-sm font-bold text-slate-400'>Menyiapkan Audio & Tafsir...</div>";
            try {
                const [resS, resT, resU] = await Promise.all([
                    fetch(`${API_EQURAN}/surat/${no}`),
                    fetch(`${API_EQURAN}/tafsir/${no}`),
                    fetch(`${API_UMMAH}/${no}?reciter=${store.qari}`)
                ]);
                store.surah = (await resS.json()).data;
                store.tafsir = (await resT.json()).data;
                store.ummahData = (await resU.json()).data;
                renderDetail();
            } catch (e) { alert("Data Ummah API gagal dimuat."); }
        }

        function renderDetail() {
            document.getElementById('btn-back').classList.remove('hidden');
            document.getElementById('tab-switcher').classList.remove('hidden');
            document.getElementById('search-section').classList.add('hidden');
            
            const s = store.surah;
            let header = `
                <div class="p-8 rounded-[2.5rem] neu-flat text-center mb-8 bg-gradient-to-b from-white/40 to-transparent">
                    <h2 class="font-arabic text-5xl text-blue-600 mb-2">${s.nama}</h2>
                    <h3 class="font-bold text-xl">${s.namaLatin}</h3>
                    <p class="text-[10px] font-bold text-slate-400 mt-2 uppercase tracking-widest">Diturunkan di ${s.tempatTurun} • ${s.arti}</p>
                    <button onclick="playFullSurah()" class="mt-6 px-8 py-3 rounded-full bg-blue-600 text-white text-[11px] font-bold shadow-xl active:scale-95 transition-all">PUTAR FULL SURAT</button>
                </div>
            `;

            let ayatHtml = `<div id="view-ayat" class="space-y-6">`;
            s.ayat.forEach((a, i) => {
                ayatHtml += `
                    <div id="ayat-${i}" class="p-6 rounded-3xl neu-flat transition-all duration-300">
                        <div class="flex justify-between items-center mb-6">
                            <span class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-100 text-[9px] font-bold text-slate-400">${a.nomorAyat}</span>
                            <div class="flex gap-2">
                                <button onclick="shareWA(${i})" class="p-2.5 neu-flat rounded-xl hover:text-green-500">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
                                </button>
                                <button onclick="playAyat(${i})" class="p-2.5 neu-flat rounded-xl text-blue-600 hover:bg-blue-600 hover:text-white transition-all">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                </button>
                            </div>
                        </div>
                        <p class="text-right font-arabic text-3xl leading-[2.6] mb-5 text-slate-800">${a.teksArab}</p>
                        <p class="text-blue-600 text-[11px] font-bold mb-3 italic leading-relaxed">${a.teksLatin}</p>
                        <p class="text-slate-500 text-xs leading-relaxed">${a.teksIndonesia}</p>
                    </div>
                `;
            });
            ayatHtml += "</div>";

            let tafsirHtml = `<div id="view-tafsir" class="hidden space-y-5">`;
            store.tafsir.tafsir.forEach((t, i) => {
                tafsirHtml += `
                    <div class="p-6 rounded-3xl neu-flat">
                        <div class="text-[10px] font-bold text-blue-600 mb-3 uppercase tracking-widest bg-blue-50 inline-block px-3 py-1 rounded-lg">Ayat ${t.ayat}</div>
                        <p id="t-text-${i}" class="text-slate-600 text-xs leading-relaxed line-clamp-3">${t.teks}</p>
                        <button onclick="toggleTafsir(${i})" id="t-btn-${i}" class="mt-4 text-[10px] font-bold text-blue-500 uppercase flex items-center gap-1">Selengkapnya ⬇️</button>
                    </div>
                `;
            });
            tafsirHtml += "</div>";

            document.getElementById('main-content').innerHTML = header + ayatHtml + tafsirHtml;
            switchMode(store.mode);
        }

        function toggleTafsir(i) {
            const el = document.getElementById(`t-text-${i}`);
            const btn = document.getElementById(`t-btn-${i}`);
            const isClamped = el.classList.toggle('line-clamp-3');
            btn.innerText = isClamped ? "Selengkapnya ⬇️" : "Sembunyikan ⬆️";
        }

        function switchMode(m) {
            store.mode = m;
            document.getElementById('view-ayat').classList.toggle('hidden', m !== 'ayat');
            document.getElementById('view-tafsir').classList.toggle('hidden', m !== 'tafsir');
            document.getElementById('tab-ayat').className = m === 'ayat' ? 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-blue-600' : 'px-4 py-1.5 rounded-lg';
            document.getElementById('tab-tafsir').className = m === 'tafsir' ? 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-blue-600' : 'px-4 py-1.5 rounded-lg';
        }

        // --- Audio Core Logic ---

        function initAudioCore() {
            const slider = document.getElementById('p-slider');
            store.audio.ontimeupdate = () => {
                if(!isNaN(store.audio.duration)) {
                    const progress = (store.audio.currentTime / store.audio.duration) * 100;
                    slider.value = progress;
                    document.getElementById('p-current').innerText = formatTime(store.audio.currentTime);
                    document.getElementById('p-total').innerText = formatTime(store.audio.duration);
                }
            };
            slider.oninput = () => {
                store.audio.currentTime = (slider.value / 100) * store.audio.duration;
            };
            store.audio.onended = () => {
                if(store.idx !== -1 && store.idx < store.surah.ayat.length - 1) nextAyat();
                else updateUIStatus(false);
            };
        }

        function playAyat(idx) {
            store.idx = idx;
            const audioUrl = store.ummahData.ayah_by_ayah[idx].audio_url;
            startPlayback(audioUrl, `${store.surah.namaLatin} : ${idx + 1}`, "Mode Ayat");
            
            // Highlight & Auto-scroll
            document.querySelectorAll('.active-card').forEach(c => c.classList.remove('active-card'));
            const card = document.getElementById(`ayat-${idx}`);
            if(card) {
                card.classList.add('active-card');
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function playFullSurah() {
            store.idx = -1;
            const audioUrl = store.ummahData.full_surah_audio;
            startPlayback(audioUrl, store.surah.namaLatin, "Full Surat");
        }

        function startPlayback(url, title, mode) {
            store.audio.src = url;
            store.audio.play();
            document.getElementById('p-surah').innerText = title;
            document.getElementById('p-mode-label').innerText = mode;
            document.getElementById('player-bar').classList.remove('translate-y-full');
            updateUIStatus(true);
        }

        function togglePlay() {
            if(store.audio.paused) { store.audio.play(); updateUIStatus(true); }
            else { store.audio.pause(); updateUIStatus(false); }
        }

        function updateUIStatus(playing) {
            document.getElementById('svg-play').classList.toggle('hidden', playing);
            document.getElementById('svg-pause').classList.toggle('hidden', !playing);
        }

        function nextAyat() { if(store.idx !== -1 && store.idx < store.surah.ayat.length - 1) playAyat(store.idx + 1); }
        function prevAyat() { if(store.idx > 0) playAyat(store.idx - 1); }

        async function changeQari(val) {
            store.qari = val;
            // Reload Ummah API data for new Qari
            const resU = await fetch(`${API_UMMAH}/${store.surah.nomor}?reciter=${store.qari}`);
            store.ummahData = (await resU.json()).data;
            
            if(!store.audio.paused) {
                store.idx === -1 ? playFullSurah() : playAyat(store.idx);
            }
        }

        function formatTime(s) {
            let m = Math.floor(s / 60);
            let sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0'+sec : sec}`;
        }

        function showHome() { renderHome(store.all); window.scrollTo(0,0); }
        function filterSurah(v) { renderHome(store.all.filter(s => s.namaLatin.toLowerCase().includes(v.toLowerCase()))); }
        function shareWA(idx) {
            const a = store.surah.ayat[idx];
            const msg = encodeURIComponent(`*${store.surah.namaLatin} Ayat ${a.nomorAyat}*\n\n${a.teksArab}\n\n"${a.teksIndonesia}"`);
            window.open(`https://wa.me/?text=${msg}`);
        }
    </script>
</body>
</html>

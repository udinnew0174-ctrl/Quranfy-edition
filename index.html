<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quranfy+ | Quran Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #E0F2FE; --primary: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #1e293b; }
        .font-arabic { font-family: 'Amiri', serif; }
        .neu-flat { background: var(--bg); box-shadow: 5px 5px 10px #beccd7, -5px -5px 10px #ffffff; }
        .neu-pressed { background: var(--bg); box-shadow: inset 3px 3px 6px #beccd7, inset -3px -3px 6px #ffffff; }
        .glass { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .active-card { border-right: 5px solid var(--primary); background: rgba(255,255,255,0.4); }
    </style>
</head>
<body class="pb-44">

    <nav class="sticky top-0 z-50 glass px-5 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <button id="btn-back" onclick="showHome()" class="hidden p-2 neu-flat rounded-xl active:scale-90 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h1 class="text-lg font-bold text-blue-700">Quranfy+</h1>
        </div>
        <div id="tab-switcher" class="hidden flex p-1 rounded-xl neu-pressed text-[10px] font-bold">
            <button onclick="switchMode('ayat')" id="tab-ayat" class="px-4 py-1.5 rounded-lg bg-white shadow-sm text-blue-600">AYAT</button>
            <button onclick="switchMode('tafsir')" id="tab-tafsir" class="px-4 py-1.5 rounded-lg">TAFSIR</button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-5">
        <div id="search-section" class="mb-6">
            <input type="text" oninput="filterSurah(this.value)" placeholder="Cari Surat..." class="w-full p-4 rounded-2xl neu-pressed outline-none text-sm">
        </div>
        <div id="main-content" class="space-y-4">
            <div class="text-center py-20 opacity-50">Memuat Kalamullah...</div>
        </div>
    </main>

    <div id="player-bar" class="fixed bottom-0 left-0 right-0 glass px-6 py-5 translate-y-full transition-transform duration-500 z-50 rounded-t-[2.5rem] shadow-2xl">
        <div class="max-w-2xl mx-auto flex flex-col gap-3">
            
            <div class="flex justify-between items-center">
                <div class="min-w-0 flex-1">
                    <p id="p-surah" class="font-bold text-xs truncate text-blue-800">Nama Surat</p>
                    <p id="p-mode-label" class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Pilih Qari</p>
                </div>
                <select id="qari-select" onchange="updateQari(this.value)" class="bg-white/60 text-[10px] font-bold text-blue-600 outline-none p-2 rounded-xl max-w-[150px]">
                    <optgroup label="Ummah API (Premium)">
                        <option value="um-1">Mishary Rashid</option>
                        <option value="um-2">Al-Sudais</option>
                        <option value="um-3">Abdul Basit (Murattal)</option>
                        <option value="um-4">Abdul Basit (Mujawwad)</option>
                        <option value="um-5">Maher Al Muaiqly</option>
                        <option value="um-6">Saad Al-Ghamdi</option>
                        <option value="um-7">Hani Ar-Rifai</option>
                        <option value="um-8">Abu Bakr Al Shatri</option>
                    </optgroup>
                    <optgroup label="Default (Fallback)">
                        <option value="eq-01">Abdullah Al-Juhany</option>
                        <option value="eq-05">Misyari Al-Afasy</option>
                    </optgroup>
                </select>
            </div>

            <div class="flex flex-col gap-1">
                <input type="range" id="p-slider" class="w-full h-1.5 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600" value="0">
                <div class="flex justify-between text-[10px] font-mono text-slate-400">
                    <span id="p-current">0:00</span>
                    <span id="p-total">0:00</span>
                </div>
            </div>
            
            <div class="flex items-center justify-center gap-10">
                <button onclick="prevAyat()" class="p-3 neu-flat rounded-full active:scale-90">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button onclick="togglePlay()" class="p-5 bg-blue-600 text-white rounded-full shadow-lg active:scale-90">
                    <svg id="svg-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="svg-pause" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button onclick="nextAyat()" class="p-3 neu-flat rounded-full active:scale-90">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_EQ = "https://equran.id/api/v2";
        const API_UM = "https://ummahapi.com/api/quran/audio";
        const API_KEY = "umh_b4e43c0917f38b5415569f336a3f77aa76ce8e39";
        
        let store = { all: [], surah: null, tafsir: null, ummahData: null, qari: 'um-1', idx: -1, mode: 'ayat', audio: new Audio() };

        window.onload = () => { fetchList(); initAudio(); };

        async function fetchList() {
            const res = await fetch(`${API_EQ}/surat`);
            const json = await res.json();
            store.all = json.data;
            renderHome(store.all);
        }

        function renderHome(data) {
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('tab-switcher').classList.add('hidden');
            document.getElementById('search-section').classList.remove('hidden');
            document.getElementById('main-content').innerHTML = data.map(s => `
                <div onclick="loadDetail(${s.nomor})" class="p-5 rounded-2xl neu-flat flex justify-between items-center active:scale-95 transition-all cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div class="text-xs font-bold text-blue-300">#${s.nomor}</div>
                        <div><h3 class="font-bold text-sm">${s.namaLatin}</h3><p class="text-[9px] text-slate-400 font-bold uppercase">${s.arti}</p></div>
                    </div>
                    <p class="font-arabic text-xl text-blue-600">${s.nama}</p>
                </div>
            `).join('');
        }

        async function loadDetail(no) {
            document.getElementById('main-content').innerHTML = "<p class='text-center py-20 font-bold opacity-50'>Memuat Kalamullah...</p>";
            const [resS, resT] = await Promise.all([ fetch(`${API_EQ}/surat/${no}`), fetch(`${API_EQ}/tafsir/${no}`) ]);
            store.surah = (await resS.json()).data;
            store.tafsir = (await resT.json()).data;
            
            if(store.qari.startsWith('um')) {
                await fetchUmmahData(no, store.qari.split('-')[1]);
            }
            renderDetail();
        }

        async function fetchUmmahData(no, reciterId) {
            try {
                const res = await fetch(`${API_UM}/${no}?reciter=${reciterId}`, {
                    headers: { 'x-api-key': API_KEY }
                });
                const json = await res.json();
                store.ummahData = json.data;
            } catch (e) { console.error("Ummah API Error"); }
        }

        function renderDetail() {
            document.getElementById('btn-back').classList.remove('hidden');
            document.getElementById('tab-switcher').classList.remove('hidden');
            document.getElementById('search-section').classList.add('hidden');
            const s = store.surah;
            let html = `
                <div class="p-8 rounded-[2.5rem] neu-flat text-center mb-8 bg-gradient-to-b from-blue-50/50 to-transparent">
                    <h2 class="font-arabic text-5xl text-blue-600 mb-2">${s.nama}</h2>
                    <h3 class="font-bold text-xl">${s.namaLatin}</h3>
                    <button onclick="playFull()" class="mt-6 px-8 py-3 rounded-full bg-blue-600 text-white text-[11px] font-bold shadow-lg active:scale-95 transition-all">PUTAR FULL SURAT</button>
                </div>
                <div id="view-ayat" class="space-y-6">
            `;
            s.ayat.forEach((a, i) => {
                html += `
                    <div id="ayat-${i}" class="p-6 rounded-3xl neu-flat transition-all">
                        <div class="flex justify-between items-center mb-5">
                            <span class="text-[9px] font-bold text-slate-300">AYAT ${a.nomorAyat}</span>
                            <button onclick="playAyat(${i})" class="p-2 neu-flat rounded-xl text-blue-600 active:neu-pressed"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
                        </div>
                        <p class="text-right font-arabic text-3xl leading-[2.6] mb-4">${a.teksArab}</p>
                        <p class="text-slate-500 text-xs leading-relaxed">${a.teksIndonesia}</p>
                    </div>
                `;
            });
            html += `</div><div id="view-tafsir" class="hidden space-y-5">`;
            store.tafsir.tafsir.forEach((t, i) => {
                html += `<div class="p-6 rounded-3xl neu-flat"><p class="text-xs leading-relaxed text-slate-600">${t.teks}</p></div>`;
            });
            html += `</div>`;
            document.getElementById('main-content').innerHTML = html;
        }

        function initAudio() {
            const s = document.getElementById('p-slider');
            store.audio.ontimeupdate = () => {
                if(!isNaN(store.audio.duration)) {
                    s.value = (store.audio.currentTime / store.audio.duration) * 100;
                    document.getElementById('p-current').innerText = format(store.audio.currentTime);
                    document.getElementById('p-total').innerText = format(store.audio.duration);
                }
            };
            s.oninput = () => store.audio.currentTime = (s.value / 100) * store.audio.duration;
            store.audio.onended = () => { if(store.idx !== -1 && store.idx < store.surah.ayat.length-1) nextAyat(); else updatePlayIcon(false); };
        }

        async function playAyat(idx) {
            store.idx = idx;
            let url = "";
            const [type, qid] = store.qari.split('-');
            
            if(type === 'um') {
                if(!store.ummahData) await fetchUmmahData(store.surah.nomor, qid);
                url = store.ummahData.ayah_by_ayah[idx].audio_url;
            } else {
                url = store.surah.ayat[idx].audio[qid.padStart(2, '0')];
            }
            startAudio(url, `${store.surah.namaLatin} : ${idx+1}`);
            highlightAyat(idx);
        }

        async function playFull() {
            store.idx = -1;
            let url = "";
            const [type, qid] = store.qari.split('-');
            if(type === 'um') {
                if(!store.ummahData) await fetchUmmahData(store.surah.nomor, qid);
                url = store.ummahData.full_surah_audio;
            } else {
                url = store.surah.audioFull[qid.padStart(2, '0')];
            }
            startAudio(url, store.surah.namaLatin);
        }

        function startAudio(url, title) {
            store.audio.src = url;
            store.audio.play().catch(() => alert("Gagal memuat audio. Silakan coba qari lain."));
            document.getElementById('p-surah').innerText = title;
            document.getElementById('player-bar').classList.remove('translate-y-full');
            updatePlayIcon(true);
        }

        function togglePlay() { if(store.audio.paused) { store.audio.play(); updatePlayIcon(true); } else { store.audio.pause(); updatePlayIcon(false); } }
        function updatePlayIcon(p) { document.getElementById('svg-play').classList.toggle('hidden', p); document.getElementById('svg-pause').classList.toggle('hidden', !p); }
        function format(s) { let m = Math.floor(s/60); let sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0'+sec : sec}`; }
        function nextAyat() { if(store.idx !== -1 && store.idx < store.surah.ayat.length-1) playAyat(store.idx + 1); }
        function prevAyat() { if(store.idx > 0) playAyat(store.idx - 1); }
        function highlightAyat(idx) {
            document.querySelectorAll('.active-card').forEach(c => c.classList.remove('active-card'));
            const card = document.getElementById(`ayat-${idx}`);
            if(card) { card.classList.add('active-card'); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }
        async function updateQari(v) {
            store.qari = v;
            if(v.startsWith('um')) await fetchUmmahData(store.surah.nomor, v.split('-')[1]);
            if(!store.audio.paused) store.idx === -1 ? playFull() : playAyat(store.idx);
        }
        function showHome() { renderHome(store.all); window.scrollTo(0,0); }
        function switchMode(m) {
            store.mode = m;
            document.getElementById('view-ayat').classList.toggle('hidden', m !== 'ayat');
            document.getElementById('view-tafsir').classList.toggle('hidden', m !== 'tafsir');
            document.getElementById('tab-ayat').className = m === 'ayat' ? 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-blue-600' : 'px-4 py-1.5 rounded-lg';
            document.getElementById('tab-tafsir').className = m === 'tafsir' ? 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-blue-600' : 'px-4 py-1.5 rounded-lg';
        }
    </script>
</body>
</html>
